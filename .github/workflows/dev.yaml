# dev.yaml
# Corre: (a) solo "validate" en Pull Request hacia "dev"
#        (b) validate + deploy + run cuando el código llega a "dev" (push)
# Despliega contra el target "development" del Lab 08 (databricks.yml),
# que resuelve a la variable catalog_dev -> catalog "dab_lab_dev".

# Autenticación: OAuth M2M con el service principal sp-dab-dev (no PAT).
# DATABRICKS_HOST es igual en dev y prod (un solo workspace) -> repo secret.
# DATABRICKS_CLIENT_ID / DATABRICKS_CLIENT_SECRET son del Environment "dev".
name: Deploy to dev

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency: dev-${{ github.ref }}

jobs:
  validate:
    name: "Validate bundle"
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Resolve dashboard catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("dashboards/retail_analytics_dashboard.lvdash.json")
          dashboard = json.loads(path.read_text())

          def resolve(value):
            if isinstance(value, dict):
              return {key: resolve(item) for key, item in value.items()}
            if isinstance(value, list):
              return [resolve(item) for item in value]
            if isinstance(value, str):
              return value.replace("${var.catalog}", "dab_lacrosse_dev")
            return value

          path.write_text(json.dumps(resolve(dashboard), indent=2) + "\n")
          PY
      - run: databricks bundle validate
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_BUNDLE_VAR_catalog: dab_lacrosse_dev
          DATABRICKS_BUNDLE_ENV: development

  deploy:
    name: "Deploy bundle"
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: databricks/setup-cli@main
      - name: Resolve dashboard catalog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("dashboards/retail_analytics_dashboard.lvdash.json")
          dashboard = json.loads(path.read_text())

          def resolve(value):
            if isinstance(value, dict):
              return {key: resolve(item) for key, item in value.items()}
            if isinstance(value, list):
              return [resolve(item) for item in value]
            if isinstance(value, str):
              return value.replace("${var.catalog}", "dab_lacrosse_dev")
            return value

          path.write_text(json.dumps(resolve(dashboard), indent=2) + "\n")
          PY
      - run: databricks bundle deploy -t development
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_BUNDLE_VAR_catalog: dab_lacrosse_dev
          DATABRICKS_BUNDLE_ENV: development
      - run: databricks bundle run -t development lacrosse_orchestration_job
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          DATABRICKS_BUNDLE_VAR_catalog: dab_lacrosse_dev
          DATABRICKS_BUNDLE_ENV: development

